# Serves the built dashboard and proxies /api/* to the `api` service
# (see docker-compose.yml) so the frontend can call relative /api URLs
# in production the same way it does via Vite's dev proxy.
server {
    listen 4173;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
